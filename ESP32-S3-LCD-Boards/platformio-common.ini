; Shared PlatformIO settings for every ESP32-S3-LCD-* project. Each project's platformio.ini pulls this in with
;   [platformio]
;   extra_configs = ../ESP32-S3-LCD-Boards/platformio-common.ini
; and defines [project] extra_libs (empty if none) for any libraries it needs on top of the shared ones.
; (A key defined in both files takes this file's value, so per-project additions can't go in [env] lib_deps.)
;
; Pick your board with -e, e.g. `pio run -e lcd169 -t upload`.
;   lcd169  ESP32-S3-Touch-LCD-1.69  240x280  (WAV-27932)
;   lcd2    ESP32-S3-LCD-2           240x320  (WAV-30306)
;   lcd28   ESP32-S3-Touch-LCD-2.8   240x320  (WAV-30223)
;   lcd147  ESP32-S3-LCD-1.47        172x320

[common]
base_libs =
  WaveshareLCD
  lovyan03/LovyanGFX@^1.1.16

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_extra_dirs = ../ESP32-S3-LCD-Boards/lib
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${common.base_libs}
  ${project.extra_libs}

[env:lcd169]
build_flags = ${env.build_flags} -DBOARD_LCD_169

[env:lcd2]
build_flags = ${env.build_flags} -DBOARD_LCD_2

[env:lcd28]
build_flags = ${env.build_flags} -DBOARD_LCD_28

[env:lcd147]
build_flags = ${env.build_flags} -DBOARD_LCD_147
